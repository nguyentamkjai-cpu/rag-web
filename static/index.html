<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sông Hiếu RAG — hỏi trên tài liệu của bạn</title>
  <style>
    :root {
      --bg: #10140f;
      --panel: #1a2118;
      --line: #31402c;
      --text: #e7f0e2;
      --muted: #9aaf92;
      --accent: #c6f25d;
      --ink: #17200c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(1000px 420px at 8% -10%, #24331d, var(--bg));
    }
    header, main { width: min(1080px, calc(100% - 28px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: end; padding: 28px 0 14px; gap: 12px; }
    h1, h2 { margin: 0; }
    .eyebrow { margin: 0 0 4px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding-bottom: 32px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .drop {
      display: grid; gap: 4px; margin: 12px 0; cursor: pointer;
      border: 1px dashed var(--line); border-radius: 12px; padding: 16px;
    }
    .drop span, .meta { color: var(--muted); font-size: 13px; }
    #docs { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    #docs li { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
    button, .ghost { border: 0; border-radius: 10px; background: var(--accent); color: var(--ink); font-weight: 650; padding: 10px 14px; cursor: pointer; }
    .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 8px; }
    .chat { display: flex; flex-direction: column; min-height: 70vh; }
    .log { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: auto; max-height: 62vh; }
    .bubble { padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: end; background: #2c3b22; max-width: 80%; }
    .bot { background: #12180f; border: 1px solid var(--line); }
    .src { color: var(--muted); font-size: 12px; margin-top: 8px; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
    textarea {
      resize: vertical; border-radius: 12px; border: 1px solid var(--line);
      background: #10160e; color: var(--text); padding: 10px 12px; font: inherit;
    }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">RAG web</p>
      <h1>Hỏi đáp trên tài liệu của bạn</h1>
    </div>
    <span id="mode" class="pill">đang kiểm tra…</span>
  </header>
  <main>
    <section class="panel">
      <h2>Tài liệu</h2>
      <label class="drop">
        <input id="file" type="file" accept=".txt,.md,.pdf" hidden />
        <strong>Thả hoặc chọn file</strong>
        <span>.txt, .md, .pdf — tối đa 15 MB</span>
      </label>
      <ul id="docs"></ul>
    </section>
    <section class="panel chat">
      <h2>Hỏi đáp</h2>
      <div id="log" class="log"></div>
      <form id="ask">
        <textarea id="q" rows="2" placeholder="Ví dụ: được nghỉ phép năm bao nhiêu ngày?"></textarea>
        <button type="submit">Hỏi</button>
      </form>
    </section>
  </main>
  <script>
    const docsEl = document.querySelector("#docs");
    const logEl = document.querySelector("#log");
    const modeEl = document.querySelector("#mode");

    function addBubble(text, who, sources) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = "Nguồn: " + sources.map((x, i) => "[" + (i + 1) + "] " + x.title).join(" · ");
        div.appendChild(s);
      }
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function refresh() {
      const docs = await fetch("/api/docs").then((r) => r.json());
      docsEl.innerHTML = "";
      if (!docs.length) {
        docsEl.innerHTML = "<li><span class='meta'>Chưa có tài liệu.</span></li>";
        return;
      }
      for (const d of docs) {
        const li = document.createElement("li");
        li.innerHTML = "<div><strong>" + d.title + "</strong><div class='meta'>" + d.chunks + " đoạn · " + d.chars + " ký tự</div></div>";
        const btn = document.createElement("button");
        btn.className = "ghost";
        btn.textContent = "Xóa";
        btn.onclick = async () => {
          await fetch("/api/docs/" + d.id, { method: "DELETE" });
          refresh();
        };
        li.appendChild(btn);
        docsEl.appendChild(li);
      }
    }

    document.querySelector("#file").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const body = new FormData();
      body.append("file", file);
      const res = await fetch("/api/upload", { method: "POST", body });
      if (!res.ok) { alert(await res.text()); return; }
      e.target.value = "";
      refresh();
    };

    document.querySelector("#ask").onsubmit = async (e) => {
      e.preventDefault();
      const q = document.querySelector("#q");
      const question = q.value.trim();
      if (!question) return;
      addBubble(question, "user");
      q.value = "";
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      modeEl.textContent = data.mode === "llm" ? "model mở" : "trích đoạn";
      addBubble(data.answer, "bot", data.sources);
    };

    fetch("/api/health").then((r) => r.json()).then((h) => {
      modeEl.textContent = "sẵn sàng · " + h.ollama_model;
    }).catch(() => { modeEl.textContent = "mở cùng server RAG"; });
    refresh().catch(() => {});
    addBubble("Tải một file lên, rồi hỏi bằng tiếng Việt. Trang này gọi API của app RAG trên cùng máy chủ.", "bot");
  </script>
</body>
</html>
