<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trợ lý tổng quát</title>
  <style>
    :root { --bg:#0e1210; --panel:#1a2218; --line:#31402c; --text:#e7f0e2; --muted:#9aaf92; --accent:#c6f25d; --ink:#17200c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); background:radial-gradient(1000px 420px at 8% -10%, #24331d, var(--bg)); }
    header, main { width:min(860px, calc(100% - 28px)); margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:end; gap:12px; padding:28px 0 12px; }
    h1 { margin:0; font-size:28px; }
    .eyebrow { margin:0 0 4px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
    button, .ghost { border:0; border-radius:10px; background:var(--accent); color:var(--ink); font-weight:700; padding:10px 14px; cursor:pointer; }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    main { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; min-height:70vh; display:flex; flex-direction:column; }
    #log { flex:1; display:flex; flex-direction:column; gap:10px; overflow:auto; max-height:62vh; }
    .bubble { padding:12px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.5; }
    .user { align-self:end; background:#2c3b22; max-width:85%; }
    .bot { background:#12180f; border:1px solid var(--line); }
    .src { color:var(--muted); font-size:12px; margin-top:8px; }
    form { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:12px; }
    textarea, input { font:inherit; color:var(--text); background:#10160e; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
    textarea { resize:vertical; }
    dialog { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:16px; width:min(480px, 92vw); }
    dialog label { display:grid; gap:4px; margin:10px 0; font-size:14px; }
    .hint { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Thay trang hỏi tài liệu</p>
      <h1>Trợ lý tổng quát</h1>
    </div>
    <button class="ghost" id="open-settings" type="button">Khóa API</button>
  </header>
  <main>
    <div id="log"></div>
    <form id="ask">
      <textarea id="q" rows="2" placeholder="Hỏi bất kỳ điều gì, ví dụ: thủ đô của Việt Nam là gì?"></textarea>
      <button type="submit">Hỏi</button>
    </form>
  </main>
  <dialog id="settings">
    <form method="dialog">
      <h2>Model của bạn</h2>
      <p class="hint">Để trống thì trang chỉ tra Wikipedia. Khóa lưu trên trình duyệt này, không gửi lên GitHub.</p>
      <label>Địa chỉ API
        <input id="base" placeholder="https://api.x.ai/v1" />
      </label>
      <label>Model
        <input id="model" placeholder="grok-3" />
      </label>
      <label>API key
        <input id="key" type="password" placeholder="xai-..." />
      </label>
      <button type="submit">Lưu</button>
    </form>
  </dialog>
  <script>
    const log = document.querySelector("#log");
    const settings = document.querySelector("#settings");
    const fields = ["base", "model", "key"];
    for (const id of fields) {
      const saved = localStorage.getItem("ai-" + id);
      if (saved) document.querySelector("#" + id).value = saved;
    }
    document.querySelector("#open-settings").onclick = () => settings.showModal();
    settings.onclose = () => {
      for (const id of fields) localStorage.setItem("ai-" + id, document.querySelector("#" + id).value.trim());
    };

    function say(text, who, sources) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.innerHTML = sources.map((x) => '<a href="' + x.url + '" target="_blank" rel="noopener">' + x.title + "</a>").join(" · ");
        div.appendChild(s);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function wiki(lang, question) {
      const search = new URL("https://" + lang + ".wikipedia.org/w/api.php");
      search.searchParams.set("action", "query");
      search.searchParams.set("list", "search");
      search.searchParams.set("srsearch", question);
      search.searchParams.set("srlimit", "3");
      search.searchParams.set("format", "json");
      search.searchParams.set("origin", "*");
      const found = await fetch(search).then((r) => r.json());
      const hits = (found.query && found.query.search) || [];
      const out = [];
      for (const hit of hits) {
        const page = new URL("https://" + lang + ".wikipedia.org/w/api.php");
        page.searchParams.set("action", "query");
        page.searchParams.set("prop", "extracts");
        page.searchParams.set("exintro", "1");
        page.searchParams.set("explaintext", "1");
        page.searchParams.set("titles", hit.title);
        page.searchParams.set("format", "json");
        page.searchParams.set("origin", "*");
        const body = await fetch(page).then((r) => r.json());
        const pages = body.query.pages || {};
        const first = Object.values(pages)[0];
        if (!first || !first.extract) continue;
        out.push({
          title: first.title + " (" + lang + ")",
          text: first.extract.slice(0, 700),
          url: "https://" + lang + ".wikipedia.org/wiki/" + encodeURIComponent(first.title.replace(/ /g, "_"))
        });
      }
      return out;
    }

    async function lookup(question) {
      const vi = await wiki("vi", question);
      if (vi.length) return vi;
      return wiki("en", question);
    }

    async function modelAnswer(question, sources) {
      const base = localStorage.getItem("ai-base");
      const model = localStorage.getItem("ai-model");
      const key = localStorage.getItem("ai-key");
      if (!base || !model || !key) return null;
      const context = sources.map((s, i) => "[" + (i + 1) + "] " + s.title + "\n" + s.text).join("\n\n");
      const res = await fetch(base.replace(/\/$/, "") + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({
          model,
          temperature: 0.2,
          messages: [
            { role: "system", content: "Trả lời tiếng Việt, ngắn, dựa trên nguồn nếu có. Nếu nguồn không đủ, nói rõ phần nào là suy luận." },
            { role: "user", content: "NGUỒN:\n" + context + "\n\nCÂU HỎI: " + question }
          ]
        })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      return data.choices[0].message.content;
    }

    document.querySelector("#ask").onsubmit = async (e) => {
      e.preventDefault();
      const box = document.querySelector("#q");
      const question = box.value.trim();
      if (!question) return;
      say(question, "user");
      box.value = "";
      say("Đang tra cứu…", "bot");
      try {
        const sources = await lookup(question);
        let text;
        try { text = await modelAnswer(question, sources); } catch (err) { text = "Không gọi được model: " + err.message; }
        if (!text) {
          text = sources.length
            ? sources.map((s, i) => "[" + (i + 1) + "] " + s.title + "\n" + s.text).join("\n\n")
            : "Không tìm thấy trang Wikipedia khớp. Thêm khóa API trong nút Khóa API để model viết câu trả lời.";
        }
        log.lastChild.remove();
        say(text, "bot", sources);
      } catch (err) {
        log.lastChild.remove();
        say("Lỗi tra cứu: " + err.message, "bot");
      }
    };
    say("Hỏi một câu bất kỳ. Trang tra Wikipedia tiếng Việt, rồi tiếng Anh. Muốn câu trả lời do model viết, bấm Khóa API và dán khóa của bạn (ví dụ API xAI). Trang này không gọi được Grok trong cuộc chat.", "bot");
  </script>
</body>
</html>
