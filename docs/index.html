<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dịch — kiểu Google Dịch</title>
  <style>
    :root { --bg:#f8f9fa; --card:#fff; --line:#dadce0; --text:#202124; --muted:#5f6368; --blue:#1a73e8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI", Arial, sans-serif; color:var(--text); background:var(--bg); }
    header, main { width:min(980px, calc(100% - 24px)); margin:0 auto; }
    header { padding:22px 0 8px; }
    h1 { margin:0; font-size:28px; }
    p { color:var(--muted); margin:6px 0 0; }
    .box { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-top:16px; }
    .pane { padding:14px; min-height:280px; display:flex; flex-direction:column; gap:10px; }
    .pane + .pane { border-left:1px solid var(--line); background:#fafafa; }
    select, textarea, button { font:inherit; }
    select { border:0; background:transparent; color:var(--blue); font-weight:650; padding:4px; }
    textarea { flex:1; border:0; resize:none; outline:none; background:transparent; font-size:20px; line-height:1.45; }
    .bar { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; cursor:pointer; }
    button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    .status { color:var(--muted); font-size:13px; padding:8px 2px 20px; }
    @media (max-width:760px) { .box { grid-template-columns:1fr; } .pane + .pane { border-left:0; border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <h1>Dịch ngôn ngữ</h1>
    <p>Nhập câu nước ngoài, trang lấy bản dịch từ Google Dịch.</p>
  </header>
  <main>
    <div class="box">
      <section class="pane">
        <div class="bar">
          <select id="from"></select>
          <button type="button" id="speak-in">Nghe</button>
        </div>
        <textarea id="input" placeholder="Nhập chữ cần dịch"></textarea>
      </section>
      <section class="pane">
        <div class="bar">
          <select id="to"></select>
          <span>
            <button type="button" id="swap">Đổi chiều</button>
            <button type="button" id="speak-out">Nghe</button>
            <button type="button" id="copy">Chép</button>
          </span>
        </div>
        <textarea id="output" readonly placeholder="Bản dịch"></textarea>
      </section>
    </div>
    <div class="status" id="status">Sẵn sàng.</div>
  </main>
  <script>
    const languages = [
      ["auto", "Tự nhận ngôn ngữ"],
      ["vi", "Tiếng Việt"],
      ["en", "English"],
      ["zh-CN", "中文"],
      ["ja", "日本語"],
      ["ko", "한국어"],
      ["fr", "Français"],
      ["de", "Deutsch"],
      ["es", "Español"],
      ["th", "ไทย"],
      ["lo", "ລາວ"],
      ["km", "ភាសាខ្មែរ"],
      ["ru", "Русский"],
      ["id", "Indonesia"]
    ];
    const from = document.querySelector("#from");
    const to = document.querySelector("#to");
    const input = document.querySelector("#input");
    const output = document.querySelector("#output");
    const status = document.querySelector("#status");
    for (const [code, name] of languages) {
      from.add(new Option(name, code));
      if (code !== "auto") to.add(new Option(name, code));
    }
    from.value = "auto";
    to.value = "vi";

    function speak(text, lang) {
      if (!text || !window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang === "auto" ? "en-US" : lang;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }
    async function google(text, source, target) {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="
        + encodeURIComponent(source) + "&tl=" + encodeURIComponent(target) + "&q=" + encodeURIComponent(text);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Google " + res.status);
      const data = await res.json();
      const translated = data[0].map((part) => part[0]).join("");
      const detected = data[2] || source;
      return { translated, detected, via: "Google Dịch" };
    }
    async function lingva(text, source, target) {
      const sl = source === "auto" ? "auto" : source;
      const url = "https://lingva.ml/api/v1/" + encodeURIComponent(sl) + "/" + encodeURIComponent(target) + "/" + encodeURIComponent(text);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Lingva " + res.status);
      const data = await res.json();
      if (!data.translation) throw new Error("không có bản dịch");
      return { translated: data.translation, detected: sl, via: "Google Dịch qua Lingva" };
    }
    let timer;
    async function translate() {
      const text = input.value.trim();
      if (!text) { output.value = ""; status.textContent = "Sẵn sàng."; return; }
      status.textContent = "Đang lấy bản dịch từ Google…";
      try {
        let result;
        try { result = await google(text, from.value, to.value); }
        catch { result = await lingva(text, from.value, to.value); }
        output.value = result.translated;
        status.textContent = result.via + (result.detected && result.detected !== "auto" ? " · nhận ra " + result.detected : "");
      } catch (err) {
        output.value = "";
        status.textContent = "Không lấy được Google Dịch từ trang này: " + err.message;
      }
    }
    input.oninput = () => { clearTimeout(timer); timer = setTimeout(translate, 400); };
    from.onchange = translate;
    to.onchange = translate;
    document.querySelector("#swap").onclick = () => {
      if (from.value === "auto") from.value = "en";
      const next = from.value;
      from.value = to.value;
      to.value = next;
      input.value = output.value;
      translate();
    };
    document.querySelector("#copy").onclick = () => navigator.clipboard.writeText(output.value || "");
    document.querySelector("#speak-in").onclick = () => speak(input.value, from.value);
    document.querySelector("#speak-out").onclick = () => speak(output.value, to.value);
  </script>
</body>
</html>
