<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gia sư AI tiếng Anh</title>
  <style>
    :root { --bg:#10140f; --panel:#1a2218; --line:#31402c; --text:#e8f2e3; --muted:#9aaf92; --accent:#c6f25d; --ink:#17200c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); background:radial-gradient(980px 400px at 8% -10%, #24331d, var(--bg)); }
    header, main { width:min(880px, calc(100% - 28px)); margin:0 auto; }
    header { padding:26px 0 10px; display:flex; justify-content:space-between; align-items:end; gap:12px; }
    h1 { margin:0; font-size:28px; }
    .eyebrow { margin:0 0 4px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
    button { border:0; border-radius:10px; background:var(--accent); color:var(--ink); font-weight:700; padding:10px 14px; cursor:pointer; }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    main { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; min-height:72vh; display:flex; flex-direction:column; }
    #log { flex:1; display:flex; flex-direction:column; gap:10px; overflow:auto; max-height:60vh; }
    .bubble { padding:12px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.5; }
    .user { align-self:end; background:#2c3b22; max-width:85%; }
    .bot { background:#12180f; border:1px solid var(--line); }
    form, .setup { display:grid; gap:8px; margin-top:12px; }
    form { grid-template-columns:1fr auto auto; }
    textarea, input { font:inherit; color:var(--text); background:#10160e; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
    textarea { resize:vertical; }
    .hear { margin-top:8px; padding:6px 8px; }
    .hint { color:var(--muted); font-size:13px; margin:0; }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">AI tiếng Anh · nhớ hội thoại · có giọng</p>
      <h1>Gia sư AI</h1>
    </div>
    <button class="ghost" id="reset" type="button">Đổi khóa</button>
  </header>
  <main>
    <div id="log"></div>
    <div class="setup" id="setup">
      <p class="hint">Trang gọi AI của bạn. Khóa chỉ lưu trên trình duyệt này, không lên GitHub. Mặc định là API xAI.</p>
      <input id="base" placeholder="https://api.x.ai/v1" />
      <input id="model" placeholder="grok-3" />
      <input id="key" type="password" placeholder="Dán API key" />
      <button type="button" id="save">Bắt đầu học với AI</button>
    </div>
    <form id="ask" hidden>
      <textarea id="q" rows="2" placeholder="Viết hoặc bấm Nói…"></textarea>
      <button type="button" id="mic" class="ghost">Nói</button>
      <button type="submit">Gửi</button>
    </form>
  </main>
  <script>
    const history = [{ role: "system", content: "Bạn là gia sư tiếng Anh cho người Việt. Mỗi lượt: một câu mẫu tiếng Anh, giải thích ngắn bằng tiếng Việt, rồi một câu hỏi để học viên nói tiếp. Sửa lỗi ngữ pháp nếu có. Giữ mạch hội thoại. Không bịa khóa API hay trang web." }];
    const log = document.querySelector("#log");
    const setup = document.querySelector("#setup");
    const askForm = document.querySelector("#ask");

    function cfg() {
      return {
        base: localStorage.getItem("ai-base") || "",
        model: localStorage.getItem("ai-model") || "",
        key: localStorage.getItem("ai-key") || ""
      };
    }
    function speak(text) {
      if (!window.speechSynthesis) return;
      const english = (text.match(/English: ([^\n]+)/) || [null, text.split("\n")[0]])[1];
      const utter = new SpeechSynthesisUtterance(english);
      utter.lang = "en-US";
      utter.rate = 0.9;
      const voice = speechSynthesis.getVoices().find((v) => /^en/i.test(v.lang));
      if (voice) utter.voice = voice;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }
    function say(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      if (who === "bot") {
        const hear = document.createElement("button");
        hear.className = "ghost hear";
        hear.type = "button";
        hear.textContent = "Nghe";
        hear.onclick = () => speak(text);
        div.appendChild(hear);
        speak(text);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
    function showChat(on) {
      setup.hidden = on;
      askForm.hidden = !on;
    }
    async function ai(text) {
      const { base, model, key } = cfg();
      history.push({ role: "user", content: text });
      const res = await fetch(base.replace(/\/$/, "") + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({ model, temperature: 0.4, messages: history.slice(-12) })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error && data.error.message ? data.error.message : "AI từ chối yêu cầu");
      const answer = data.choices[0].message.content;
      history.push({ role: "assistant", content: answer });
      return answer;
    }
    document.querySelector("#save").onclick = () => {
      localStorage.setItem("ai-base", document.querySelector("#base").value.trim() || "https://api.x.ai/v1");
      localStorage.setItem("ai-model", document.querySelector("#model").value.trim() || "grok-3");
      localStorage.setItem("ai-key", document.querySelector("#key").value.trim());
      if (!cfg().key) { say("Cần API key thì trang mới gọi được AI.", "bot"); return; }
      showChat(true);
      say("AI đã sẵn sàng. English: Hello, I am your tutor. What is your name?", "bot");
    };
    document.querySelector("#reset").onclick = () => {
      localStorage.removeItem("ai-key");
      showChat(false);
    };
    document.querySelector("#mic").onclick = () => {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { say("Dùng Chrome để nói.", "bot"); return; }
      const rec = new Rec();
      rec.lang = "en-US";
      rec.onresult = (e) => {
        document.querySelector("#q").value = e.results[0][0].transcript;
        askForm.requestSubmit();
      };
      rec.onerror = () => say("Không nghe được. Cho phép micro rồi thử lại.", "bot");
      rec.start();
    };
    askForm.onsubmit = async (e) => {
      e.preventDefault();
      const box = document.querySelector("#q");
      const text = box.value.trim();
      if (!text) return;
      say(text, "user");
      box.value = "";
      say("AI đang trả lời…", "bot");
      try {
        const answer = await ai(text);
        log.lastChild.remove();
        say(answer, "bot");
      } catch (err) {
        log.lastChild.remove();
        history.pop();
        say("Không gọi được AI: " + err.message + "\nKiểm tra khóa, model và địa chỉ API.", "bot");
      }
    };
    const saved = cfg();
    document.querySelector("#base").value = saved.base || "https://api.x.ai/v1";
    document.querySelector("#model").value = saved.model || "grok-3";
    if (saved.key) {
      document.querySelector("#key").value = saved.key;
      showChat(true);
      say("Đã có khóa trên trình duyệt này. English: Hello again. What do you want to practice?", "bot");
    } else {
      say("Trang này dùng AI qua API của bạn. Dán khóa, rồi học, chat và sửa câu đều do model trả lời. Nghe và Nói vẫn có.", "bot");
    }
  </script>
</body>
</html>
