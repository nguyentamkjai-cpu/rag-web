<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI học từ mạng xã hội</title>
  <style>
    :root { --bg:#10140f; --panel:#1a2218; --line:#31402c; --text:#e8f2e3; --muted:#9aaf92; --accent:#c6f25d; --ink:#17200c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); background:var(--bg); }
    header, main { width:min(1100px, calc(100% - 24px)); margin:0 auto; }
    header { padding:24px 0 8px; }
    h1, h2 { margin:0; }
    .eyebrow { margin:0 0 4px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
    main { display:grid; grid-template-columns:320px 1fr; gap:14px; padding-bottom:28px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; }
    label, .hint { color:var(--muted); font-size:13px; }
    textarea, input, select, button { font:inherit; }
    textarea, input, select { width:100%; margin:6px 0 10px; border:1px solid var(--line); background:#10160e; color:var(--text); border-radius:10px; padding:8px 10px; }
    button { border:0; border-radius:10px; background:var(--accent); color:var(--ink); font-weight:700; padding:10px 12px; cursor:pointer; }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    li { border-top:1px solid var(--line); padding-top:8px; }
    #log { min-height:320px; display:flex; flex-direction:column; gap:8px; }
    .bubble { padding:10px 12px; border-radius:12px; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:end; background:#2c3b22; }
    .bot { background:#12180f; border:1px solid var(--line); }
    form { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:10px; }
    @media (max-width:800px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Cấu trúc web AI</p>
    <h1>Học thêm từ mạng xã hội</h1>
  </header>
  <main>
    <section>
      <h2>1. Nguồn</h2>
      <label>Nền tảng</label>
      <select id="platform">
        <option>X</option>
        <option>Facebook</option>
        <option>Threads</option>
        <option>RSS</option>
        <option>Khác</option>
      </select>
      <label>Dán bài viết công khai</label>
      <textarea id="post" rows="6" placeholder="Dán nội dung một bài công khai, hoặc đường dẫn bài."></textarea>
      <button id="learn" type="button">Đưa vào bộ nhớ</button>
      <p class="hint">Trang không đăng nhập hộ và không lấy bài riêng tư. Bạn chỉ đưa nội dung được phép dùng.</p>
      <h2 style="margin-top:16px">2. Đã học</h2>
      <ul id="memory"></ul>
    </section>
    <section>
      <h2>3. Hỏi AI trên kiến thức vừa học</h2>
      <div id="log"></div>
      <form id="ask">
        <input id="q" placeholder="Hỏi từ những bài đã dán" />
        <button type="submit">Hỏi</button>
      </form>
    </section>
  </main>
  <script>
    const key = "social-memory";
    const memory = JSON.parse(localStorage.getItem(key) || "[]");
    const list = document.querySelector("#memory");
    const log = document.querySelector("#log");
    function save() { localStorage.setItem(key, JSON.stringify(memory)); }
    function paint() {
      list.innerHTML = memory.length ? "" : "<li class='hint'>Chưa có bài nào.</li>";
      memory.forEach((item, i) => {
        const li = document.createElement("li");
        li.innerHTML = "<strong>" + item.platform + "</strong><div class='hint'>" + item.text.slice(0, 120) + "</div>";
        const btn = document.createElement("button");
        btn.className = "ghost";
        btn.textContent = "Xóa";
        btn.onclick = () => { memory.splice(i, 1); save(); paint(); };
        li.appendChild(btn);
        list.appendChild(li);
      });
    }
    function say(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      log.appendChild(div);
    }
    function answer(question) {
      const words = question.toLowerCase().split(/\s+/).filter((w) => w.length > 2);
      const ranked = memory.map((item) => {
        const low = item.text.toLowerCase();
        return { item, score: words.filter((w) => low.includes(w)).length };
      }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
      if (!ranked.length) return "Chưa thấy ý này trong bài đã học. Dán thêm bài công khai liên quan.";
      return ranked.map((x, i) => "[" + (i + 1) + "] " + x.item.platform + "\n" + x.item.text.slice(0, 280)).join("\n\n");
    }
    document.querySelector("#learn").onclick = () => {
      const text = document.querySelector("#post").value.trim();
      if (!text) return;
      memory.unshift({ platform: document.querySelector("#platform").value, text, at: new Date().toISOString() });
      document.querySelector("#post").value = "";
      save();
      paint();
    };
    document.querySelector("#ask").onsubmit = (e) => {
      e.preventDefault();
      const q = document.querySelector("#q");
      if (!q.value.trim()) return;
      say(q.value.trim(), "user");
      say(answer(q.value.trim()), "bot");
      q.value = "";
    };
    paint();
    say("Cấu trúc trang: Nguồn để nạp bài, Đã học để xem bộ nhớ, Hỏi để tra trên đúng phần đã nạp.", "bot");
  </script>
</body>
</html>
