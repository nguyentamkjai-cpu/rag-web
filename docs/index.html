<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chấm bài AI</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --line:#d7dee7; --text:#1c2430; --muted:#5d6b7a; --blue:#2457d6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header, main { width:min(1100px, calc(100% - 24px)); margin:0 auto; }
    header { display:flex; justify-content:space-between; gap:12px; align-items:end; padding:22px 0 8px; }
    h1, h2 { margin:0; }
    .muted { color:var(--muted); font-size:14px; }
    main { display:grid; gap:14px; padding-bottom:28px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    input, textarea, button { font:inherit; }
    input, textarea { border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
    textarea { width:100%; min-height:90px; }
    button { border:0; background:var(--blue); color:#fff; border-radius:10px; padding:9px 12px; cursor:pointer; }
    .ghost { background:#eef2f8; color:var(--text); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; border-bottom:1px solid var(--line); padding:8px; vertical-align:top; }
    .flag { color:#a33; font-weight:700; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Chấm bài AI</h1>
      <p class="muted">Theo chương trình AI-Assignment-Marking: nộp bài, chấm rubric Computer Systems, kiểm tra giống nhau.</p>
    </div>
    <div class="row">
      <input id="key" type="password" placeholder="Gemini API key, không bắt buộc" />
      <button id="save" type="button" class="ghost">Lưu khóa</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Nộp bài</h2>
      <p class="muted">Tên file dạng S10485739_Alice.txt. Có thể dán nội dung nếu không có file.</p>
      <div class="row">
        <input id="file" type="file" accept=".txt,.md" />
        <input id="sid" placeholder="Mã sinh viên" />
        <input id="sname" placeholder="Tên" />
      </div>
      <textarea id="text" placeholder="Nội dung bài: normalization, index, memory allocation..."></textarea>
      <button id="add" type="button">Thêm bài</button>
    </section>
    <section>
      <div class="row" style="justify-content:space-between">
        <h2>Bảng bài nộp</h2>
        <button id="grade-all" type="button">Chấm tất cả</button>
      </div>
      <table>
        <thead><tr><th>Sinh viên</th><th>File</th><th>Điểm</th><th>Trùng</th><th>Nhận xét</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const store = "marking-submissions";
    const rubric = "Computer Systems, 100 điểm: Normalization 35, Index 30, Memory allocation 35.";
    let items = JSON.parse(localStorage.getItem(store) || "[]");
    const keyInput = document.querySelector("#key");
    keyInput.value = localStorage.getItem("gemini-key") || "";
    document.querySelector("#save").onclick = () => localStorage.setItem("gemini-key", keyInput.value.trim());

    function words(text) { return new Set(text.toLowerCase().match(/[a-z0-9]+/g) || []); }
    function similarity(a, b) {
      const A = words(a), B = words(b);
      if (!A.size || !B.size) return 0;
      let inter = 0;
      A.forEach((w) => { if (B.has(w)) inter += 1; });
      return inter / (A.size + B.size - inter);
    }
    function refreshRisk() {
      items.forEach((item) => {
        let best = 0;
        items.forEach((other) => {
          if (other.id !== item.id) best = Math.max(best, similarity(item.text, other.text));
        });
        item.risk = Math.round(best * 100);
        item.flagged = best >= 0.45;
      });
    }
    function localGrade(text) {
      const low = text.toLowerCase();
      const parts = [
        ["normal", 35], ["index", 30], ["memory", 15], ["paging", 10], ["fragment", 10]
      ];
      let score = 0;
      const hit = [];
      parts.forEach(([word, points]) => { if (low.includes(word)) { score += points; hit.push(word); } });
      score = Math.min(100, score);
      return { score, feedback: hit.length ? "Bài có nhắc: " + hit.join(", ") + ". Cần ví dụ và giải thích sâu hơn theo rubric." : "Bài chưa phủ normalization, index và memory allocation." };
    }
    async function grade(item) {
      const key = localStorage.getItem("gemini-key");
      if (!key) return localGrade(item.text);
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: rubric + "\nChấm bài sau, trả JSON {\"score\": number, \"draft_feedback\": string}.\n" + item.text.slice(0, 8000) }] }] })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error && data.error.message || "Gemini lỗi");
      const raw = data.candidates[0].content.parts.map((p) => p.text).join("");
      const json = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
      return { score: Number(json.score), feedback: json.draft_feedback };
    }
    function paint() {
      refreshRisk();
      localStorage.setItem(store, JSON.stringify(items));
      const body = document.querySelector("#rows");
      body.innerHTML = "";
      items.forEach((item) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + item.studentId + " · " + item.name + "</td><td>" + item.filename + "</td><td>" + (item.score ?? "—") + "</td><td class='" + (item.flagged ? "flag" : "") + "'>" + item.risk + "%</td><td>" + (item.feedback || "") + "</td>";
        const td = document.createElement("td");
        const b = document.createElement("button");
        b.className = "ghost";
        b.textContent = "Chấm";
        b.onclick = async () => {
          try { const g = await grade(item); item.score = g.score; item.feedback = g.feedback; item.gradedAt = new Date().toISOString(); }
          catch (err) { item.feedback = err.message; }
          paint();
        };
        td.appendChild(b);
        tr.appendChild(td);
        body.appendChild(tr);
      });
    }
    document.querySelector("#file").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.querySelector("#text").value = await file.text();
      const m = file.name.match(/S?(\d+)[_-]([^.]+)/i);
      if (m) { document.querySelector("#sid").value = m[1]; document.querySelector("#sname").value = m[2]; }
    };
    document.querySelector("#add").onclick = () => {
      const text = document.querySelector("#text").value.trim();
      const studentId = document.querySelector("#sid").value.trim() || "unknown";
      const name = document.querySelector("#sname").value.trim() || "Student";
      if (!text) return;
      items.unshift({ id: crypto.randomUUID(), studentId, name, filename: "S" + studentId + "_" + name + ".txt", text, score: null, feedback: "", risk: 0, flagged: false });
      document.querySelector("#text").value = "";
      paint();
    };
    document.querySelector("#grade-all").onclick = async () => {
      for (const item of items) {
        if (item.score != null) continue;
        try { const g = await grade(item); item.score = g.score; item.feedback = g.feedback; }
        catch (err) { item.feedback = err.message; }
      }
      paint();
    };
    paint();
  </script>
</body>
</html>
