<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hỏi tài liệu — trang web</title>
  <style>
    :root { --bg:#10140f; --panel:#1c2619; --line:#33442d; --text:#e8f2e3; --muted:#9aaf92; --accent:#c6f25d; --ink:#17200c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text); background:radial-gradient(900px 380px at 10% -8%, #24331d, var(--bg)); }
    header, main { width:min(980px, calc(100% - 28px)); margin:0 auto; }
    header { padding:32px 0 12px; }
    .eyebrow { margin:0 0 6px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
    h1 { margin:0 0 8px; font-size:32px; }
    p.lead { margin:0; color:var(--muted); max-width:62ch; }
    main { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:18px 0 36px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
    label.drop { display:grid; gap:4px; margin:12px 0; border:1px dashed var(--line); border-radius:12px; padding:14px; cursor:pointer; }
    .meta { color:var(--muted); font-size:13px; }
    #docs { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    button { border:0; border-radius:10px; background:var(--accent); color:var(--ink); font-weight:700; padding:10px 14px; cursor:pointer; }
    .log { display:flex; flex-direction:column; gap:10px; min-height:280px; }
    .bubble { padding:12px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:end; background:#2c3b22; max-width:85%; }
    .bot { background:#12180f; border:1px solid var(--line); }
    form { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:12px; }
    textarea, input[type=file] { font:inherit; }
    textarea { resize:vertical; border-radius:12px; border:1px solid var(--line); background:#10160e; color:var(--text); padding:10px 12px; }
    @media (max-width:800px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Trang web công khai</p>
    <h1>Hỏi trên tài liệu của bạn</h1>
    <p class="lead">Trang này chạy ngay trên trình duyệt. Tài liệu không gửi lên máy chủ. Đã nạp sẵn một văn bản mẫu để hỏi thử.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Tài liệu</h2>
      <label class="drop">
        <input id="file" type="file" accept=".txt,.md" hidden />
        <strong>Chọn file .txt hoặc .md</strong>
        <span class="meta">File chỉ nằm trên máy bạn</span>
      </label>
      <ul id="docs"></ul>
    </section>
    <section class="panel">
      <h2>Hỏi đáp</h2>
      <div id="log" class="log"></div>
      <form id="ask">
        <textarea id="q" rows="2" placeholder="Ví dụ: được nghỉ phép năm bao nhiêu ngày?"></textarea>
        <button type="submit">Hỏi</button>
      </form>
    </section>
  </main>
  <script>
    const docs = [{
      title: "Chính sách nghỉ phép (mẫu)",
      text: "Nhân viên chính thức được 12 ngày phép năm sau khi thử việc. Phép tồn cuối năm được chuyển tối đa 5 ngày sang quý I năm sau. Nghỉ ốm có giấy của cơ sở y tế không trừ phép năm, tối đa 30 ngày mỗi năm. Nghỉ không lương cần đơn trước 3 ngày làm việc và được quản lý trực tiếp duyệt. Thai sản được 6 tháng theo luật, có thể nghỉ thêm không lương 2 tháng nếu báo trước 30 ngày."
    }];
    const docsEl = document.querySelector("#docs");
    const logEl = document.querySelector("#log");

    function paintDocs() {
      docsEl.innerHTML = docs.map((d) => "<li><strong>" + d.title + "</strong><div class='meta'>" + d.text.length + " ký tự</div></li>").join("");
    }
    function say(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function answer(question) {
      const words = question.toLowerCase().split(/\s+/).filter((w) => w.length > 2);
      let best = null, score = 0;
      for (const d of docs) {
        const sentences = d.text.split(/(?<=[.!?])\s+/);
        for (const s of sentences) {
          const low = s.toLowerCase();
          const n = words.filter((w) => low.includes(w)).length;
          if (n > score) { score = n; best = { title: d.title, text: s }; }
        }
      }
      if (!best || score === 0) return "Không thấy câu nào khớp trong tài liệu đang mở.";
      return best.text + "\n\nNguồn: " + best.title;
    }
    document.querySelector("#file").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      docs.push({ title: file.name, text: await file.text() });
      e.target.value = "";
      paintDocs();
      say("Đã thêm " + file.name + ". Hỏi theo nội dung file đó.", "bot");
    };
    document.querySelector("#ask").onsubmit = (e) => {
      e.preventDefault();
      const q = document.querySelector("#q");
      const question = q.value.trim();
      if (!question) return;
      say(question, "user");
      q.value = "";
      say(answer(question), "bot");
    };
    paintDocs();
    say("Trang đã mở. Hỏi thử: được nghỉ phép năm bao nhiêu ngày?", "bot");
  </script>
</body>
</html>
