<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xây app bằng chat</title>
  <style>
    :root { --bg:#0c0e12; --panel:#151922; --line:#2a3140; --text:#eef2f6; --muted:#8b97a8; --accent:#7cffb2; --ink:#102216; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:grid; grid-template-columns:240px 1fr 1fr; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; }
    aside, main, .preview { min-height:0; }
    aside { border-right:1px solid var(--line); padding:16px; }
    main, .preview { display:flex; flex-direction:column; }
    .preview { border-left:1px solid var(--line); }
    h1 { font-size:16px; margin:0 0 12px; }
    .eyebrow { color:var(--accent); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    button, textarea { font:inherit; }
    button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:8px 10px; cursor:pointer; }
    button.on, button.primary { background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:700; }
    .jobs { display:grid; gap:8px; margin-top:14px; }
    .job { text-align:left; }
    #log { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
    .bubble { max-width:92%; padding:12px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
    .user { align-self:end; background:#243044; }
    .bot { background:var(--panel); border:1px solid var(--line); }
    .composer { padding:12px; border-top:1px solid var(--line); }
    .types { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    textarea { width:100%; min-height:72px; resize:vertical; border-radius:12px; border:1px solid var(--line); background:#10141c; color:var(--text); padding:10px; }
    .send { margin-top:8px; }
    iframe { flex:1; width:100%; border:0; background:#fff; }
    .bar { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
    @media (max-width:900px) { body { grid-template-columns:1fr; height:auto; } .preview { min-height:420px; } }
  </style>
</head>
<body>
  <aside>
    <p class="eyebrow">Agent chat</p>
    <h1>Việc đang làm</h1>
    <button id="new" type="button">Việc mới</button>
    <div class="jobs" id="jobs"></div>
  </aside>
  <main>
    <div id="log"></div>
    <form class="composer" id="ask">
      <div class="types">
        <button type="button" class="on" data-type="Landing">Landing</button>
        <button type="button" data-type="Web app">Web app</button>
        <button type="button" data-type="Bảng">Bảng</button>
      </div>
      <textarea id="q" placeholder="Mô tả app bạn muốn. Ví dụ: trang đặt bàn cho quán cà phê, có menu và form đặt chỗ."></textarea>
      <button class="primary send" type="submit">Dựng bản xem</button>
    </form>
  </main>
  <section class="preview">
    <div class="bar">Bản xem trước · chưa phải site đã xuất bản</div>
    <iframe id="frame" title="Xem trước"></iframe>
  </section>
  <script>
    const jobs = JSON.parse(localStorage.getItem("agent-jobs") || "[]");
    let current = jobs[0] || null;
    let kind = "Landing";
    const log = document.querySelector("#log");
    const frame = document.querySelector("#frame");
    function save() { localStorage.setItem("agent-jobs", JSON.stringify(jobs)); }
    function paintJobs() {
      const box = document.querySelector("#jobs");
      box.innerHTML = "";
      jobs.forEach((job) => {
        const b = document.createElement("button");
        b.className = "job" + (current && current.id === job.id ? " on" : "");
        b.textContent = job.title;
        b.onclick = () => { current = job; openJob(); };
        box.appendChild(b);
      });
    }
    function say(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
    function page(title, brief) {
      return "<!doctype html><html><head><meta charset='utf-8'><title>" + title + "</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:#f6f7f4;color:#1b2118}header,main{width:min(760px,calc(100% - 28px));margin:auto}header{padding:36px 0 8px}h1{margin:0 0 8px}p{color:#556052}.card{background:#fff;border:1px solid #e1e6dc;border-radius:14px;padding:14px;margin:10px 0}button,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #d5dccf}button{background:#c6f25d;border:0;font-weight:700}</style></head><body><header><p>Bản dựng từ chat</p><h1>" + title + "</h1><p>" + brief + "</p></header><main><form class='card'><input placeholder='Tên'><input placeholder='Ghi chú' style='margin-left:8px'><button style='margin-left:8px'>Lưu</button></form><div id='list' class='card'>Chưa có mục nào.</div></main><script>document.querySelector('form').onsubmit=function(e){e.preventDefault();document.querySelector('#list').textContent='Đã lưu: '+document.querySelector('input').value}<\/script></body></html>";
    }
    function openJob() {
      log.innerHTML = "";
      if (!current) { say("Chọn loại app, rồi mô tả việc cần làm. Mình dựng bản xem trước bên phải.", "bot"); frame.srcdoc = page("Chưa có app", "Gửi một mô tả để bắt đầu."); paintJobs(); return; }
      current.messages.forEach((m) => say(m.text, m.who));
      frame.srcdoc = current.html;
      paintJobs();
    }
    document.querySelectorAll("[data-type]").forEach((btn) => btn.onclick = () => {
      kind = btn.dataset.type;
      document.querySelectorAll("[data-type]").forEach((b) => b.classList.toggle("on", b === btn));
    });
    document.querySelector("#new").onclick = () => { current = null; openJob(); };
    document.querySelector("#ask").onsubmit = (e) => {
      e.preventDefault();
      const text = document.querySelector("#q").value.trim();
      if (!text) return;
      document.querySelector("#q").value = "";
      if (!current) {
        current = { id: crypto.randomUUID(), title: text.slice(0, 32), kind, messages: [], html: "" };
        jobs.unshift(current);
      }
      current.messages.push({ who: "user", text });
      const html = page(current.title, text);
      current.html = html;
      current.messages.push({ who: "bot", text: "Mình đã dựng bản " + kind + " cho: " + text + "\n\nBên phải là bản xem trước. Muốn sửa, nói tiếp điều cần đổi." });
      save();
      openJob();
    };
    openJob();
  </script>
</body>
</html>
